<style>
/* 작업대: 왼쪽 (폰은 아래) = 레이저로 자른 자작 원판 (끼운 판은 빈 구멍으로 남음), 오른쪽 = 조립대. 글 대신 모양·색으로 말함 */
:root {
  --bg: #e9e7e0; --ink: #1f2420; --muted: #6b6f67; --line: #d3cfc4;
  --sheet: #e7d4b0; --sheet-edge: #b98d5d; --birch: #f1e2c4; --burn: #6e4526; --hole: #cbb58f;
  --accent: #8a4a1f; --bad: #b8402f; --wait: #c08a1b; --stage: #dedbd1; --ghost: #ffffff; --paper: #fbfaf6; --done: #c9c4b8;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141715; --ink: #e9e6de; --muted: #9a9d94; --line: #303732;
  --sheet: #5a4a33; --sheet-edge: #2f2619; --birch: #e3cda4; --burn: #4a2e18; --hole: #2a2219;
  --accent: #e09a60; --bad: #ef7c66; --wait: #e2b44d; --stage: #222724; --ghost: #dfe6e0; --paper: #1c201e; --done: #9aa096; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141715; --ink: #e9e6de; --muted: #9a9d94; --line: #303732;
  --sheet: #5a4a33; --sheet-edge: #2f2619; --birch: #e3cda4; --burn: #4a2e18; --hole: #2a2219;
  --accent: #e09a60; --bad: #ef7c66; --wait: #e2b44d; --stage: #222724; --ghost: #dfe6e0; --paper: #1c201e; --done: #9aa096; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
.app { height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* 원판: 판 모양이 잘린 합판 한 장 */
.sheet { min-height: 0; overflow: auto; background: var(--sheet); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--sheet-edge);
  padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; }
.part { position: relative; padding: 4px; border: 0; background: none; border-radius: 6px; cursor: pointer; line-height: 0; }
.part svg { overflow: visible; display: block; }
.part .fill { fill: var(--birch); stroke: var(--burn); stroke-width: 1.2; }
.part[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.part:disabled { cursor: default; }
.part:disabled .fill { fill: var(--hole); stroke: var(--sheet-edge); stroke-dasharray: 3 3; }       /* 다 끼운 판 = 원판에 남은 빈 구멍 */
.part:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.part .n { position: absolute; right: -2px; top: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--burn); color: var(--birch);
  font: 500 11px/18px var(--mono); text-align: center; padding: 0 4px; }
.part:disabled .n, .part .n:empty { display: none; }
.part.stock { padding-bottom: 18px; min-width: 64px; }
.part.stock svg { margin-inline: auto; }
.m-part.stock { min-width: 64px; text-align: center; }
.stock-tag { display: block; color: var(--ink); font: 600 9px/12px var(--mono); text-align: center; white-space: nowrap; }
.part .stock-tag { position: absolute; left: 2px; right: 2px; bottom: 1px; pointer-events: none; }
.part.pet:not(:disabled) .fill, .m-part.pet .fill { fill: rgba(174,210,222,.5); stroke: #557f8d; }
.part.shake { animation: shake .3s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sheet.nudge { animation: nudge .5s; }
@keyframes nudge { 0%,100% { box-shadow: inset 0 0 0 2px var(--sheet-edge); } 50% { box-shadow: inset 0 0 0 4px var(--accent); } }
/* 조립대 */
.stage { position: relative; min-height: 0; background: var(--stage); border-radius: 6px; overflow: hidden; touch-action: none; }
.stage .view3d { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }   /* 캔버스 크기가 칸 크기를 밀어 올리지 않게 */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; row-gap: 6px; align-items: center; pointer-events: none; }   /* 넓지 않으면 도구가 다음 줄로 */
.chip { display: inline-flex; gap: 5px; align-items: center; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip svg { width: 15px; height: 15px; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: 100%; gap: 6px; pointer-events: auto; }
.kits { display: flex; gap: 4px; padding: 3px; border-radius: 22px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--ink) 7%, transparent); pointer-events: auto; margin-right: 4px; }
.kits .icon { width: 34px; height: 34px; border-color: transparent; background: none; }
.kits .icon[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon .spd { font: 700 12px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
.icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 19px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--ink); cursor: pointer; padding: 0; }
.icon svg { width: 18px; height: 18px; }
#b-bridge[hidden] { display: none; }
#b-cycle[hidden], #b-lock[hidden] { display: none; }
.tools .icon.operate { width: auto; padding: 0 10px; display: flex; gap: 4px; font: 600 12px system-ui,sans-serif; }
.icon[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon .spd { font: 700 12px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
.icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon.join { position: absolute; transform: translate(-50%, -100%); z-index: 3; background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.icon.join[data-icon="split"] { background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--ink); border-color: var(--line); width: 30px; height: 30px; }
.icon.join[hidden] { display: none; }
.icon.out { position: absolute; transform: translate(-50%, -50%); z-index: 4; background: var(--bad); color: #fff; border-color: var(--bad); box-shadow: 0 2px 10px rgba(0,0,0,.3); animation: pop-in .25s; }
@keyframes pop-in { from { transform: translate(-50%, -50%) scale(.4); } }
.icon.join.nudge { animation: blink .5s 2; }
@keyframes blink { 50% { opacity: .25; } }
.mark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; display: grid; place-items: center; pointer-events: none; animation: pop .9s forwards; }
.mark svg { width: 18px; height: 18px; }
.mark.bad { background: var(--bad); color: #fff; } .mark.wait { background: var(--wait); color: #fff; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 70% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.done { position: absolute; inset: auto 0 18px; display: flex; justify-content: center; }
.done .box { display: flex; gap: 14px; align-items: center; padding: 8px 8px 8px 16px; border-radius: 28px; background: color-mix(in srgb, var(--bg) 90%, transparent); border: 1px solid var(--line); }
.load { position: absolute; inset: 0; display: grid; place-items: center; }
.load i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.load[hidden], .done[hidden] { display: none; }
.app.map { grid-template-columns: minmax(0, 1fr); }                                         /* 마을: 원판 없이 넓게, 조립 도구는 숨김 */
.app.map .sheet, .app.map .hud .chip, .app.map #b-book, .app.map #b-hint, .app.map #b-skip, .app.map #b-ghost, .app.map #b-reset { display: none; }
.app.map .stage { cursor: default; } .app.map .stage.over { cursor: pointer; }
.kits .icon.mapk { margin-right: 4px; }
@media (max-width: 760px) { .app.map { grid-template-rows: minmax(0, 1fr); } }
/* 설명서: 종이 한 장 (단계 번호, 이번에 끼울 판, 끼우는 그림) */
.manual { position: absolute; inset: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); color: var(--ink); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.25); overflow: hidden; }
.manual[hidden] { display: none; }
.m-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 0 16px; }
.m-no { font: 500 15px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.m-no b { font-size: 34px; color: var(--ink); margin-right: 2px; }
.m-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-left: 6px; }
.m-dots button { width: 10px; height: 10px; padding: 0; border-radius: 5px; border: 1px solid var(--muted); background: none; cursor: pointer; }
.m-dots button.done { background: var(--muted); }
.m-dots button[aria-current="step"] { background: var(--accent); border-color: var(--accent); width: 22px; }
.m-head .icon { margin-left: auto; }
.m-view { position: relative; min-height: 0; overflow: hidden; }
.m-view .view3d { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }
.m-foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px 12px; border-top: 1px dashed var(--line); }
.m-parts { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; min-width: 0; }
.m-part { position: relative; line-height: 0; }
.m-part .fill { fill: var(--birch); stroke: var(--burn); stroke-width: 1.2; }
.m-part .n { position: absolute; right: -12px; bottom: -4px; font: 500 13px var(--mono); line-height: 1; color: var(--ink); }
.icon:disabled { opacity: .3; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .stage { grid-row: 1; }
  .hud { flex-wrap: wrap; row-gap: 6px; }
  .hud .chip { order: 3; }                                                                  /* 좁으면: 위 줄 = 키트 + 도구, 아래 줄 = 기록 */
  .hud .chip:first-of-type { margin-left: 6px; }
  .hud { column-gap: 6px; } .hud .icon { box-sizing: border-box; }
  .tools { gap: 2px; } .tools .icon { width: 30px; height: 30px; }                         /* 도구 7 개 + 키트가 폰 한 줄에 */
  .tools .icon svg { width: 16px; height: 16px; }
  .kits .icon { width: 28px; height: 28px; flex: none; }
  .kits { order: -1; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; margin-right: 0; }      /* 키트 7 개: 폰에서는 맨 위 한 줄 (옆으로 밀기) */
  .sheet { grid-row: 2; max-height: 32vh; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { .part.shake, .sheet.nudge, .mark, .load i { animation: none; } .mark { opacity: 1; } }
</style>

    if(KIT.bridgeLock&&(flights.length||bridgeState.busy||bridgeState.needsSync)){demo.t=setTimeout(demoStep,50);return;}
    const cycle=!!KIT.bridgeLock;stopDemo();if(cycle)startBridgeCycle();return;
  }
  if (q[0][0] === "@") {                                                                        // 덩어리 하나 끝 -> 합치기
    const m = q.shift().slice(1);
    join(m); if (!MOD[m].joined) return stopDemo();
    demo.t = setTimeout(demoStep, 1300 / SPEED); return;
  }
  const j = KIT.demo ? 0 : q.findIndex(id => id[0] !== "@" && !plan(id).blockers);
  if (j < 0 || (j > 0 && q.slice(0, j).some(x => x[0] === "@"))) return stopDemo();
  const id = q.splice(j, 1)[0], ins = KIT.demo?.insert[id];
  const p = ins ? { k: DI().sort((a,b) => dot(KIT.dirs[a],ins)-dot(KIT.dirs[b],ins))[0] } : plan(id);
  if (KIT.demo && (KIT.demo.requires[id].some(b => !placed.has(b)) || hitOut(id,p.k).length || p.blockers || p.lift)) {
    console.error('Supported demonstration blocked:', id); return stopDemo();
  }
  selected = slots[id].shape; refresh();                                                       // 원판에서 어느 판인지 보이게
  place(id, p);
  demo.t = setTimeout(demoStep, (p.lift ? 1150 : 700) / SPEED);
}
playBtn.addEventListener("click", () => mapOn ? (mapPeek ? stopPeek() : peekVillage()) : bridgeCycle ? toggleBridgeCycle() : demo ? stopDemo() : startDemo());
function showDone() {                                                  // 완성 보기 (누를 때만): 자동 조립과 같은 순서를 움직임 없이 한 번에 -> 바로 완성 (움직임·소리)
  if (!KIT) return;
  stopDemo(); $("manual").hidden = true; reset(); demoRun = true;
  for (const x of demoQueue()) { if (x[0] === "@") MOD[x.slice(1)].joined = true; else placed.add(x); }
  for (const s of Object.values(slots)) { s.ghost.visible = !placed.has(s.id); s.mesh.visible = placed.has(s.id); }
  poseAll(); flights.length = 0; refresh(); finish();
}
$("b-skip").addEventListener("click", showDone);

let svgNext = 0;
(function loop(now) {
  for (let i = 0; i < flights.length;) {                                                        // 앞에서부터: 같은 판이면 나중 움직임이 이김 (화면이 멈췄다 와도 들기 -> 내리기 순서 그대로)
    const f = flights[i]; if (now < f.t0) { i++; continue; }                                    // 차례를 기다리는 움직임
    const k = Math.min(1, (now - f.t0) / f.dur), e = 1 - Math.pow(1 - k, 3);
    f.mesh.position.lerpVectors(f.from, f.to, e); if (k >= 1) flights.splice(i, 1); else i++;
  }
  if (pulse) { const k = (now - pulse.t0) / 1400; pulseMat.opacity = k < 1 ? 0.55 * Math.sin(Math.PI * k) : 0; if (k >= 1) { scene.remove(pulse.m); pulse = null; } }
  if (bridgeState?.needsSync && !flights.length) syncBridgeState();
  stepBridgeCycle(now);
  if (motion) stepMotion(now);
  bridgeButton();
  if (drops.length) stepDrops(now);
  updateBand(); updateBought(); updateBucket(); updateCords();
  controls.update(); const man = M.built && !$("manual").hidden; if (man) M.controls.update();
  if (!SVG || now >= svgNext) {                                                                 // SVG (CPU): 그리는 데 든 시간의 3 배 쉬고 다시 그림
    const t = performance.now(); renderer.render(scene, camera); if (man) M.renderer.render(M.scene, M.camera);
    svgNext = now + Math.max(100, (performance.now() - t) * 3);
  }
  placeButtons();
  requestAnimationFrame(loop);
})(performance.now());

(async () => {                                                                                    // 올라간 키트만 (data/kits.json 목록)
  try { const ready = await fetch(`data/kits.json?v=${DATA_V}`).then(r => r.json()); for (let i = KITS.length - 1; i >= 0; i--) if (!ready.includes(KITS[i].id)) { KITS.splice(i, 1); } } catch (e) {}
  $("kits").querySelectorAll(".icon").forEach(b => { if (b.dataset.kit !== "map" && !KITS.some(k => k.id === b.dataset.kit)) b.remove(); });
  let first = "map"; try { const k = localStorage.getItem("kit"); if (KITS.some(x => x.id === k)) first = k; } catch (e) {}
  // Shared kit links take priority over remembered selection; unknown IDs fall back safely.
  const params = new URLSearchParams(location.search), requested = params.get("kit");
  if (KITS.some(k => k.id === requested)) first = requested;
  switchKit(first).then(() => { if (params.get("manual") === "1" && KIT) openManual(); })
    .catch(e => { $("load").textContent = e.message; });
})();
</script>
