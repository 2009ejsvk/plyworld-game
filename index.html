<style>
/* 작업대: 왼쪽 (폰은 아래) = 레이저로 자른 자작 원판 (끼운 판은 빈 구멍으로 남음), 오른쪽 = 조립대. 글 대신 모양·색으로 말함 */
:root {
  --bg: #e9e7e0; --ink: #1f2420; --muted: #6b6f67; --line: #d3cfc4;
  --sheet: #e7d4b0; --sheet-edge: #b98d5d; --birch: #f1e2c4; --burn: #6e4526; --hole: #cbb58f;
  --accent: #8a4a1f; --bad: #b8402f; --wait: #c08a1b; --stage: #dedbd1; --ghost: #ffffff; --paper: #fbfaf6; --done: #c9c4b8;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141715; --ink: #e9e6de; --muted: #9a9d94; --line: #303732;
  --sheet: #5a4a33; --sheet-edge: #2f2619; --birch: #e3cda4; --burn: #4a2e18; --hole: #2a2219;
  --accent: #e09a60; --bad: #ef7c66; --wait: #e2b44d; --stage: #222724; --ghost: #dfe6e0; --paper: #1c201e; --done: #9aa096; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141715; --ink: #e9e6de; --muted: #9a9d94; --line: #303732;
  --sheet: #5a4a33; --sheet-edge: #2f2619; --birch: #e3cda4; --burn: #4a2e18; --hole: #2a2219;
  --accent: #e09a60; --bad: #ef7c66; --wait: #e2b44d; --stage: #222724; --ghost: #dfe6e0; --paper: #1c201e; --done: #9aa096; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
.app { height: 100%; box-sizing: border-box; display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* 원판: 판 모양이 잘린 합판 한 장 */
.sheet { min-height: 0; overflow: auto; background: var(--sheet); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--sheet-edge);
  padding: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; }
.part { position: relative; padding: 4px; border: 0; background: none; border-radius: 6px; cursor: pointer; line-height: 0; }
.part svg { overflow: visible; display: block; }
.part .fill { fill: var(--birch); stroke: var(--burn); stroke-width: 1.2; }
.part[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.part:disabled { cursor: default; }
.part:disabled .fill { fill: var(--hole); stroke: var(--sheet-edge); stroke-dasharray: 3 3; }       /* 다 끼운 판 = 원판에 남은 빈 구멍 */
.part:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.part .n { position: absolute; right: -2px; top: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--burn); color: var(--birch);
  font: 500 11px/18px var(--mono); text-align: center; padding: 0 4px; }
.part:disabled .n, .part .n:empty { display: none; }
.part.shake { animation: shake .3s; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sheet.nudge { animation: nudge .5s; }
@keyframes nudge { 0%,100% { box-shadow: inset 0 0 0 2px var(--sheet-edge); } 50% { box-shadow: inset 0 0 0 4px var(--accent); } }
/* 조립대 */
.stage { position: relative; min-height: 0; background: var(--stage); border-radius: 6px; overflow: hidden; touch-action: none; }
.stage canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }   /* 캔버스 크기가 칸 크기를 밀어 올리지 않게 */
.bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; row-gap: 6px; align-items: center; pointer-events: none; }   /* 넓지 않으면 도구가 다음 줄로 */
.chip { display: inline-flex; gap: 5px; align-items: center; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip svg { width: 15px; height: 15px; }
.tools { margin-left: auto; display: flex; gap: 6px; pointer-events: auto; }
.kits { display: flex; gap: 4px; padding: 3px; border-radius: 22px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; background: color-mix(in srgb, var(--ink) 7%, transparent); pointer-events: auto; margin-right: 4px; }
.kits .icon { width: 34px; height: 34px; border-color: transparent; background: none; }
.kits .icon[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon .spd { font: 700 12px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
.icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 19px; border: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--ink); cursor: pointer; padding: 0; }
.icon svg { width: 18px; height: 18px; }
.icon[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon .spd { font: 700 12px/1 system-ui, sans-serif; letter-spacing: -0.02em; }
.icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon.join { position: absolute; transform: translate(-50%, -100%); z-index: 3; background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.icon.join[data-icon="split"] { background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--ink); border-color: var(--line); width: 30px; height: 30px; }
.icon.join[hidden] { display: none; }
.icon.out { position: absolute; transform: translate(-50%, -50%); z-index: 4; background: var(--bad); color: #fff; border-color: var(--bad); box-shadow: 0 2px 10px rgba(0,0,0,.3); animation: pop-in .25s; }
@keyframes pop-in { from { transform: translate(-50%, -50%) scale(.4); } }
.icon.join.nudge { animation: blink .5s 2; }
@keyframes blink { 50% { opacity: .25; } }
.mark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 17px; display: grid; place-items: center; pointer-events: none; animation: pop .9s forwards; }
.mark svg { width: 18px; height: 18px; }
.mark.bad { background: var(--bad); color: #fff; } .mark.wait { background: var(--wait); color: #fff; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 70% { opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
.done { position: absolute; inset: auto 0 18px; display: flex; justify-content: center; }
.done .box { display: flex; gap: 14px; align-items: center; padding: 8px 8px 8px 16px; border-radius: 28px; background: color-mix(in srgb, var(--bg) 90%, transparent); border: 1px solid var(--line); }
.load { position: absolute; inset: 0; display: grid; place-items: center; }
.load i { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
.load[hidden], .done[hidden] { display: none; }
.app.map { grid-template-columns: minmax(0, 1fr); }                                         /* 마을: 원판 없이 넓게, 조립 도구는 숨김 */
.app.map .sheet, .app.map .hud .chip, .app.map #b-book, .app.map #b-hint, .app.map #b-skip, .app.map #b-ghost, .app.map #b-reset { display: none; }
.app.map .stage { cursor: default; } .app.map .stage.over { cursor: pointer; }
.kits .icon.mapk { margin-right: 4px; }
@media (max-width: 760px) { .app.map { grid-template-rows: minmax(0, 1fr); } }
/* 설명서: 종이 한 장 (단계 번호, 이번에 끼울 판, 끼우는 그림) */
.manual { position: absolute; inset: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--paper); color: var(--ink); border-radius: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.25); overflow: hidden; }
.manual[hidden] { display: none; }
.m-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px 0 16px; }
.m-no { font: 500 15px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.m-no b { font-size: 34px; color: var(--ink); margin-right: 2px; }
.m-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-left: 6px; }
.m-dots button { width: 10px; height: 10px; padding: 0; border-radius: 5px; border: 1px solid var(--muted); background: none; cursor: pointer; }
.m-dots button.done { background: var(--muted); }
.m-dots button[aria-current="step"] { background: var(--accent); border-color: var(--accent); width: 22px; }
.m-head .icon { margin-left: auto; }
.m-view { position: relative; min-height: 0; overflow: hidden; }
.m-view canvas { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }
.m-foot { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px 12px; border-top: 1px dashed var(--line); }
.m-parts { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; min-width: 0; }
.m-part { position: relative; line-height: 0; }
.m-part .fill { fill: var(--birch); stroke: var(--burn); stroke-width: 1.2; }
.m-part .n { position: absolute; right: -12px; bottom: -4px; font: 500 13px var(--mono); line-height: 1; color: var(--ink); }
.icon:disabled { opacity: .3; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .stage { grid-row: 1; }
  .hud { flex-wrap: wrap; row-gap: 6px; }
  .hud .chip { order: 3; }                                                                  /* 좁으면: 위 줄 = 키트 + 도구, 아래 줄 = 기록 */
  .hud .chip:first-of-type { margin-left: 6px; }
  .hud { column-gap: 6px; } .hud .icon { box-sizing: border-box; }
  .tools { gap: 2px; } .tools .icon { width: 30px; height: 30px; }                         /* 도구 7 개 + 키트가 폰 한 줄에 */
  .tools .icon svg { width: 16px; height: 16px; }
  .kits .icon { width: 28px; height: 28px; flex: none; }
  .kits { order: -1; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; margin-right: 0; }      /* 키트 7 개: 폰에서는 맨 위 한 줄 (옆으로 밀기) */
  .sheet { grid-row: 2; max-height: 32vh; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; overflow-y: hidden; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { .part.shake, .sheet.nudge, .mark, .load i { animation: none; } .mark { opacity: 1; } }
</style>

<script>

$("b-sound").addEventListener("click", () => setSound(!SND.on)); setSound(SND.on);

// ---------- 다 지으면 움직임: 풍차 날개는 축째로 돌고, 수레는 바퀴째로 앞뒤로 굴러감 (각 = 간 거리 / 반지름). 무엇이든 만지면 멈추고 제자리

    for (const s of Object.values(slots)) { s.mesh.matrixAutoUpdate = false; s.parentInv = new THREE.Matrix4().copy(s.mesh.parent.matrixWorld).invert(); }
    const V = a => new THREE.Vector3(...a), C = V(mo.circle.center), g0 = mo.spins[0];

    const reach = g0.dist + 260, vf = THREE.MathUtils.degToRad(camera.fov / 2), dist = reach / Math.tan(Math.min(vf, Math.atan(Math.tan(vf) * camera.aspect))) * 1.05;

}
// 고무줄 (판이 아님, 실제 키트처럼 함께 들어 있음): 실패와 다리 가로대가 둘 다 놓이면 그 사이에 걸림. 뒤로 감은 만큼 실패 위 고리가 넓어짐
const BAND = {};
const toGL = p => new THREE.Vector3(p[0], p[2], -p[1]);                                          // 세계 (z 위) -> glTF (y 위)
function updateBand() {

// 사서 넣는 부품 (판 아님: 기어 모터·모터 바퀴·건전지 상자·스위치·고무 벨트·전선): 붙는 판 (host) 이 놓이면 나타나고 그 판을 따라 움직임

// ---------- 원판 (같은 모양은 한 조각 + 남은 개수)

  return `<svg width="${w.toFixed(0)}" height="${h.toFixed(0)}" viewBox="0 0 ${w.toFixed(1)} ${h.toFixed(1)}" aria-hidden="true"><path class="fill" d="${[ext, ...holes].map(ring).join("")}" fill-rule="evenodd"/></svg>`;

const left = shape => KIT.groups[shape].filter(id => !placed.has(id)).length;

  $("sheet").innerHTML = shapes.map(sh => {

  document.querySelectorAll(".part").forEach(b => b.addEventListener("click", () => { stopDemo(); selected = selected === b.dataset.shape ? null : b.dataset.shape; sfx("tick"); refresh(); }));
}

// ---------- 규칙 (하나뿐): 판은 6 방향 중 이미 놓인 판에 안 걸리는 곧은 길로 들어오고 나감. 순서·받침 규칙 없음 (실루엣이 지그처럼 잡아 줌)

  //    탭은 장부 구멍에서 곧게 빠지니 결합된 판이라도 e 쪽으로 안 걸리면 남음. 들리는 덩어리가 새 판에 걸리면 안 됨.

}

// ---------- 누르기 (끌기와 구분): 판 고르기 1 + 자리 누르기 1 = 두 번
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
let overT = 0; renderer.domElement.addEventListener("pointermove", e => {                  // 마을: 건물 위면 손가락 모양 + 이름
  if (!mapOn || e.buttons || performance.now() - overT < 60) return; overT = performance.now();
  const v = mapHit(e); stage.classList.toggle("over", !!v); stage.title = v ? v.name || KITS.find(k => k.id === v.kit)?.name || "" : "";
});
renderer.domElement.addEventListener("pointerup", e => {
  if (mapOn) { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) <= 6) { const v = mapHit(e); if (v) { stopPeek(); switchKit(v.kit); } } down = null; return; }   // 마을: 건물 누르기 = 그 키트로
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || !KIT) return; down = null;
  if (demo) return stopDemo();                                                                // 자동 조립 중 누르기 = 멈춤 (돌려 보기는 그대로)
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(Object.values(slots).filter(s => !placed.has(s.id)).map(s => s.ghost), false);
  if (!selected) {                                                                            // 판 안 고름: 놓인 판 누르기 = 빼기, 빈 자리 = 원판 깜빡
    const got = ray.intersectObjects([...placed].map(id => slots[id].mesh), false);
    if (got.length) return takeOut(got[0].object.userData.id, e.clientX, e.clientY);         // 실루엣은 비쳐 보이니 놓인 판이 먼저
    if (hits.length) { const sh = $("sheet"); sh.classList.remove("nudge"); void sh.offsetWidth; sh.classList.add("nudge"); }
    return;
  }
  if (!hits.length) return;                                                                   // 빈 곳 = 아무 일 없음
  const same = hits.map(h => slots[h.object.userData.id]).filter(s => s.shape === selected);  // 겉판 뒤 안쪽 자리도 눌러 끼울 수 있게
  if (!same.length) return miss(e.clientX, e.clientY, "bad");
  let first = null;
  for (const s of same) { const p = plan(s.id); if (!p.blockers) return place(s.id, p); first ||= p; }
  miss(e.clientX, e.clientY, "wait"); flash(first.blockers); offerOut(first.blockers);                                  // 막는 판을 보여 줌
});

// ---------- 힌트 (누를 때만): 고른 판이 지금 들어갈 자리 하나 / 안 골랐으면 지금 끼울 수 있는 판 하나를 골라 줌

// ---------- 조립 설명서 (누를 때만): 단계마다 이번 판 + 그림 (앞 단계 = 회색, 이번 = 나무, 화살표 = 끼우는 방향)
const M = { page: 0, built: false };
function buildManual() {
  const view = $("m-view");
  M.renderer = new THREE.WebGLRenderer({ antialias: true }); M.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  M.renderer.outputEncoding = THREE.sRGBEncoding; view.appendChild(M.renderer.domElement);
  M.scene = new THREE.Scene(); M.camera = camera.clone();
  M.scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8170, 0.9));
  const l = new THREE.DirectionalLight(0xffffff, 0.8); l.position.set(-300, 600, 450); M.scene.add(l);

  $("m-dots").querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => showPage(i)));
  M.built = true;
}
function arrow(dir, from, len, color) {                                              // 굵은 화살표 (막대 + 머리), from 에서 dir 쪽으로
  const g = new THREE.Group(), mat = new THREE.MeshBasicMaterial({ color });

  const head = new THREE.Mesh(new THREE.ConeGeometry(7.5, 16, 16), mat); head.position.y = len - 8;

}

  const step = KIT.steps[M.page], before = new Set(KIT.steps.slice(0, M.page).flat());
  M.scene.background = new THREE.Color(cssColor("--paper")); M.doneMat.color.set(cssColor("--done"));
  for (const [id, m] of Object.entries(M.meshes)) {
    m.visible = before.has(id) || step.includes(id);
    m.material = step.includes(id) ? slots[id].mesh.material : M.doneMat;
  }
  M.arrows.clear();
  const accent = new THREE.Color(cssColor("--accent"));
  for (const id of step) {                                                              // 끼우는 방향 화살표: 판 바깥에서 판 쪽으로
    const s = slots[id], dir = new THREE.Vector3(...s.insert), c = new THREE.Vector3(...s.center);

    `<span class="m-part">${partSVG(slots[KIT.groups[sh][0]], scale)}${n > 1 ? `<span class="n">×${n}</span>` : ""}</span>`).join("");
  $("m-no").textContent = M.page + 1; $("m-of").textContent = "/" + KIT.steps.length;
  $("m-dots").querySelectorAll("button").forEach((b, k) => {
    b.classList.toggle("done", KIT.steps[k].every(id => placed.has(id))); if (k === M.page) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });

  $("live").textContent = `${M.page + 1}단계`;
}
function openManual() {
  if (!KIT) return;
  $("manual").hidden = false;
  if (!M.built) buildManual();
  M.camera.position.copy(camera.position); M.controls.target.copy(controls.target); M.controls.update();
  const next = KIT.steps.findIndex(st => st.some(id => !placed.has(id)));                 // 아직 덜 끝난 첫 단계부터

}
$("b-book").addEventListener("click", () => $("manual").hidden ? openManual() : ($("manual").hidden = true));
$("m-close").addEventListener("click", () => $("manual").hidden = true);
$("m-prev").addEventListener("click", () => showPage(M.page - 1));
$("m-next").addEventListener("click", () => showPage(M.page + 1));
window.addEventListener("keydown", e => {
  if ($("manual").hidden) return;
  if (e.key === "ArrowLeft") showPage(M.page - 1); else if (e.key === "ArrowRight") showPage(M.page + 1); else if (e.key === "Escape") $("manual").hidden = true;
});

const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function startClock() { started = performance.now(); timer = setInterval(() => $("s-time").textContent = fmt(Math.floor((performance.now() - started) / 1000)), 500); }
function finish() {
  clearInterval(timer); controls.autoRotate = ROT; controls.autoRotateSpeed = 1.2;
  $("done-stats").innerHTML = demoRun ? `<svg><use href="#i-play"/></svg>` :                  // 자동 조립으로 끝남 = 기록 없음
    `<svg><use href="#i-clock"/></svg>${$("s-time").textContent}&nbsp;&nbsp;<svg><use href="#i-x"/></svg>${stats.miss}&nbsp;&nbsp;<svg><use href="#i-bulb"/></svg>${stats.hint}`;
  if (VKITS.has(kitId)) { BUILT.add(kitId); saveBuilt(); }
  $("b-tomap").hidden = !VKITS.has(kitId);
  $("done").hidden = false; $("live").textContent = "완성";
  sfx("done"); startMotion();
}
function reset() {
  stopMotion(); clearOuts(); placed.clear(); selected = null; stats = { miss: 0, hint: 0 }; clearInterval(timer); started = 0; demoRun = false;
  for (const m of KIT.modules) MOD[m].joined = m === KIT.base;                                // 덩어리는 다시 탁자 위 제자리로
  for (const s of Object.values(slots)) { s.mesh.visible = false; s.ghost.visible = true; }
  poseAll(); flights.length = 0; controls.autoRotate = false; $("done").hidden = true; $("s-time").textContent = "0:00"; refresh();
}
$("b-reset").addEventListener("click", () => { stopDemo(); reset(); }); $("b-tomap").addEventListener("click", () => switchKit("map")); $("b-again").addEventListener("click", () => { stopDemo(); reset(); });

// ---------- 자동 조립 (누를 때만): 처음부터, 덩어리마다 (바닥 덩어리 먼저) 판을 하나씩 끼우고 다 되면 합침. 다시 누르거나 조립대를 누르면 멈춤
let demo = null, demoRun = false;
const playBtn = $("b-play");
// 자동 조립 빠르기 (1·2·4 배) 와 완성 후 돌기 (켬/끔): 보는 사람 브라우저에 기억
const SPEEDS = [1, 2, 4]; let SPEED = 1, ROT = true;
try { SPEED = SPEEDS.includes(+localStorage.getItem("speed")) ? +localStorage.getItem("speed") : 1; ROT = localStorage.getItem("rot") !== "0"; } catch (e) {}
function showSpeed() { const b = $("b-speed"); b.querySelector(".spd").textContent = SPEED + "×"; b.title = `자동 조립 빠르기 ${SPEED}배`; b.setAttribute("aria-label", b.title); }
function showRot() { const b = $("b-rot"); b.setAttribute("aria-pressed", String(ROT)); b.title = ROT ? "완성 후 돌기: 켬" : "완성 후 돌기: 끔"; b.setAttribute("aria-label", b.title); }
$("b-speed").addEventListener("click", () => { SPEED = SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length]; showSpeed(); try { localStorage.setItem("speed", SPEED); } catch (e) {} });
$("b-rot").addEventListener("click", () => { ROT = !ROT; showRot(); if (!$("done").hidden || !ROT) controls.autoRotate = ROT && !$("done").hidden; try { localStorage.setItem("rot", ROT ? "1" : "0"); } catch (e) {} });
showSpeed(); showRot();
function setPlay(on) { playBtn.setAttribute("aria-pressed", String(on)); playBtn.innerHTML = `<svg><use href="#i-${on ? "stop" : "play"}"/></svg>`; playBtn.title = on ? "멈춤" : "자동 조립"; playBtn.setAttribute("aria-label", playBtn.title); }
function stopDemo() { if (!demo) return; clearTimeout(demo.t); demo = null; selected = null; setPlay(false); if (KIT) refresh(); }
function startDemo() {
  if (!KIT) return;
  $("manual").hidden = true; reset(); demoRun = true;
  demo = { q: demoQueue() };
  setPlay(true); demo.t = setTimeout(demoStep, 400);
}
function demoQueue() {                                                 // 마른 연습 (움직임·소리 없이 규칙만): 덩어리마다 검증된 순서로 놓고 합침.
  const seq = [];                                                      // 합칠 길을 막는 제 판 (뒤 쐐기 등) 은 빼서 합친 뒤로 미룸
  const build = m => { let q = KIT.order.filter(id => slots[id].module === m);
    while (q.length) { const id = q.find(i => !plan(i).blockers); if (!id) break; placed.add(id); seq.push(id); q = q.filter(i => i !== id); } };
  build(KIT.base);
  const baseSeq = [...seq], perms = a => a.length < 2 ? [a] : a.flatMap((x, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
  const tryOrder = order => {                                          // 이 덩어리 순서로 다 합쳐지나 (발코니는 지붕 전에, 날개는 지붕 뒤에 등)
    seq.length = 0; seq.push(...baseSeq); placed.clear(); baseSeq.forEach(x => placed.add(x));
    for (const m of KIT.modules) MOD[m].joined = m === KIT.base;
    for (const m of order) {
      build(m);
      const jp = joinPlan(m), later = jp.e !== undefined ? [] : jp.blockers ? culprits(m) : null;
      if (!later || (jp.blockers && !later.length)) return false;
      for (const x of later) { placed.delete(x); seq.splice(seq.indexOf(x), 1); }
      MOD[m].joined = true; seq.push("@" + m);
      for (const x of KIT.order.filter(x => later.includes(x))) { placed.add(x); seq.push(x); }   // 미룬 판은 검증된 순서로
    }
    return true;
  };
  perms(KIT.modules.filter(m => m !== KIT.base)).find(tryOrder);
  placed.clear(); for (const m of KIT.modules) MOD[m].joined = m === KIT.base;      // 연습 흔적 지움 (판은 아직 하나도 안 보임)
  return seq;
}
function demoStep() {
  if (!demo) return;
  const q = demo.q;
  if (!q.length) return stopDemo();
  if (q[0][0] === "@") {                                                                        // 덩어리 하나 끝 -> 합치기
    const m = q.shift().slice(1);
    join(m); if (!MOD[m].joined) return stopDemo();
    demo.t = setTimeout(demoStep, 1300 / SPEED); return;
  }
  const j = q.findIndex(id => id[0] !== "@" && !plan(id).blockers);                             // 대개 맨 앞 판 (연습한 순서)
  if (j < 0 || (j > 0 && q.slice(0, j).some(x => x[0] === "@"))) return stopDemo();
  const id = q.splice(j, 1)[0], p = plan(id);
  selected = slots[id].shape; refresh();                                                       // 원판에서 어느 판인지 보이게
  place(id, p);
  demo.t = setTimeout(demoStep, (p.lift ? 1150 : 700) / SPEED);
}
playBtn.addEventListener("click", () => mapOn ? (mapPeek ? stopPeek() : peekVillage()) : demo ? stopDemo() : startDemo());
function showDone() {                                                  // 완성 보기 (누를 때만): 자동 조립과 같은 순서를 움직임 없이 한 번에 -> 바로 완성 (움직임·소리)
  if (!KIT) return;
  stopDemo(); $("manual").hidden = true; reset(); demoRun = true;
  for (const x of demoQueue()) { if (x[0] === "@") MOD[x.slice(1)].joined = true; else placed.add(x); }
  for (const s of Object.values(slots)) { s.ghost.visible = !placed.has(s.id); s.mesh.visible = placed.has(s.id); }
  poseAll(); flights.length = 0; refresh(); finish();
}
$("b-skip").addEventListener("click", showDone);

(function loop(now) {
  for (let i = 0; i < flights.length;) {                                                        // 앞에서부터: 같은 판이면 나중 움직임이 이김 (화면이 멈췄다 와도 들기 -> 내리기 순서 그대로)
    const f = flights[i]; if (now < f.t0) { i++; continue; }                                    // 차례를 기다리는 움직임
    const k = Math.min(1, (now - f.t0) / f.dur), e = 1 - Math.pow(1 - k, 3);
    f.mesh.position.lerpVectors(f.from, f.to, e); if (k >= 1) flights.splice(i, 1); else i++;
  }
  if (pulse) { const k = (now - pulse.t0) / 1400; pulseMat.opacity = k < 1 ? 0.55 * Math.sin(Math.PI * k) : 0; if (k >= 1) { scene.remove(pulse.m); pulse = null; } }
  if (motion) stepMotion(now);
  if (drops.length) stepDrops(now);
  updateBand(); updateBought(); updateBucket(); updateCords();
  controls.update(); renderer.render(scene, camera); placeButtons();
  if (M.built && !$("manual").hidden) { M.controls.update(); M.renderer.render(M.scene, M.camera); }
  requestAnimationFrame(loop);
})(performance.now());

(async () => {                                                                                    // 올라간 키트만 (data/kits.json 목록)
  try { const ready = await fetch(`data/kits.json?v=${DATA_V}`).then(r => r.json()); for (let i = KITS.length - 1; i >= 0; i--) if (!ready.includes(KITS[i].id)) { KITS.splice(i, 1); } } catch (e) {}
  $("kits").querySelectorAll(".icon").forEach(b => { if (b.dataset.kit !== "map" && !KITS.some(k => k.id === b.dataset.kit)) b.remove(); });
  let first = "map"; try { const k = localStorage.getItem("kit"); if (KITS.some(x => x.id === k)) first = k; } catch (e) {}
  switchKit(first).catch(e => { $("load").innerHTML = `<span style="color:var(--bad)">${e.message}</span>`; });
})();
</script>
